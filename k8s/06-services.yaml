# ==============================================================================
# KYC ML SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyc-ml-service
  template:
    metadata:
      labels:
        app: kyc-ml-service
    spec:
      containers:
        - name: kyc-ml-service
          image: app/kyc-ml-service:v1.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-ml-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: kyc-ml-service
---
# ==============================================================================
# IDENTITY SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      initContainers:
      - name: migrate-identity
        image: app/migrate-identity:latest
        imagePullPolicy: IfNotPresent
        args:
        - -url=jdbc:postgresql://postgres:5432/identity_db
        - -user=$(POSTGRES_USER)
        - -password=$(POSTGRES_PASSWORD)
        - migrate
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
      containers:
      - name: identity-service
        image: app/identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/identity_db"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: SECURITY_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECURITY_USER
        - name: SECURITY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECURITY_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MAIL_USERNAME
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MAIL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: identity-service
---
