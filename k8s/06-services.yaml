              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: S3_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: user-service
---
