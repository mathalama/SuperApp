apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  GATEWAY_PORT: "8700"

  # Databases
  IDENTITY_DB: "identity_db"
  USER_DB: "user_db"
  KYC_DB: "kyc_db"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"

  # Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2QkQ2Qk"

  # Security / JWT
  JWT_EXPIRATION: "900000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # URLs
  BASE_URL: "http://localhost:8700"
  FRONTEND_URL: "http://localhost:3000"

  # Verification
  VERIFICATION_TOKEN_EXPIRY_MINUTES: "30"
  VERIFICATION_RESEND_COOLDOWN_SECONDS: "60"

  # Mail
  MAIL_HOST: "mail.mathalama.dev"
  MAIL_PORT: "587"
  SPRING_MAIL_HOST: "mail.mathalama.dev"
  SPRING_MAIL_PORT: "587"

  # S3 / MinIO
  S3_ENDPOINT: "http://minio:9000"
  S3_PORT: "8504"
  S3_CONSOLE_PORT: "8505"
  S3_BUCKET_AVATARS: "avatars"
  S3_BUCKET_KYC: "kyc-documents"
  S3_PUBLIC_URL: "http://localhost:8504"

  # Internal Services
  KYC_ML_SERVICE_URL: "http://kyc-ml-service:8000"
  ZIPKIN_PORT: "9411"