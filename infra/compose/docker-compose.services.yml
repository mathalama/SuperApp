services:
  # API GATEWAY
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: ../docker/Dockerfile.jvm
      args:
        PORT: 8010
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:8010"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    env_file:
      - ../../.env
    depends_on:
      identity-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8010 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - super-app-network

  # IDENTITY SERVICE
  identity-service:
    build:
      context: ../../services/identity-service
      dockerfile: ../docker/Dockerfile.jvm
      args:
        PORT: 8080
    container_name: identity-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${IDENTITY_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - super-app-network

  # USER SERVICE
  user-service:
    build:
      context: ../../services/user-service
      dockerfile: ../docker/Dockerfile.jvm
      args:
        PORT: 8083
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${USER_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_USER}
      S3_SECRET_KEY: ${S3_PASSWORD}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - super-app-network

  # NOTIFICATION SERVICE
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: ../docker/Dockerfile.jvm
      args:
        PORT: 8084
    container_name: notification-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL}
    env_file:
      - ../../.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8084 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - super-app-network

  # KYC SERVICE (Business Logic & Orchestration)
  kyc-service:
    build:
      context: ../../services/kyc-service
      dockerfile: ../docker/Dockerfile.jvm
      args:
        PORT: 8085
    container_name: kyc-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KYC_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_USER}
      S3_SECRET_KEY: ${S3_PASSWORD}
      S3_BUCKET_KYC: ${S3_BUCKET_KYC}
      KYC_ML_SERVICE_URL: ${KYC_ML_SERVICE_URL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      kyc-ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8085 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - super-app-network

  # KYC ML INFERENCE SERVICE (Python / ONNX / OCR / Liveness / ArcFace)
  kyc-ml-service:
    build:
      context: ../../services/kyc-ml-service
      dockerfile: ../docker/Dockerfile.ml
    container_name: kyc-ml-service
    environment:
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - super-app-network

networks:
  super-app-network:
    name: super-app-network
    driver: bridge
